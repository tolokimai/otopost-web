services:
  backend:
    build: ./backend
    container_name: otopost-backend
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CLIP_SERVER_TOKEN: ${CLIP_SERVER_TOKEN:-}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Auth & DB (Fase 0)
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      FREE_CREDITS: ${FREE_CREDITS:-30}
      # Hardening
      MAX_SEGMENTS_PER_JOB: ${MAX_SEGMENTS_PER_JOB:-30}
      MAX_CLIP_SECONDS: ${MAX_CLIP_SECONDS:-180}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
    volumes:
      - clips:/data/clips
    restart: unless-stopped

  # Frontend Next.js — opsional. Bisa juga dideploy ke Vercel.
  frontend:
    build: ./frontend
    container_name: otopost-frontend
    ports:
      - "3000:3000"
    environment:
      # Catatan: NEXT_PUBLIC_* di-inline saat build. Rebuild image bila diubah.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      NEXT_PUBLIC_REQUIRE_AUTH: ${NEXT_PUBLIC_REQUIRE_AUTH:-false}
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["with-frontend"]

  # ===== Postgres opsional (produksi) — set DATABASE_URL untuk memakainya =====
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: otopost
  #     POSTGRES_PASSWORD: otopost
  #     POSTGRES_DB: otopost
  #   volumes: [pgdata:/var/lib/postgresql/data]
  # redis:
  #   image: redis:7-alpine

volumes:
  clips:
