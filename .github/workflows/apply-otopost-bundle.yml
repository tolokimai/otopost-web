name: Apply verified OtoPost source bundle

on:
  push:
    branches: [feat/admin-studio-carousel-musetalk]
    paths:
      - ".github/workflows/apply-otopost-bundle.yml"
      - ".github/verified-bundle.part-*"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-studio-carousel-musetalk
          fetch-depth: 0
      - name: Verify and apply source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/verified-bundle.part-* > /tmp/otopost-remaining.b64
          test "$(wc -c < /tmp/otopost-remaining.b64)" = "45652"
          echo "8a1f000d5bfb56ecbd8644c6142ace018e0b8377ca4412b22652fd6588cb56a5  /tmp/otopost-remaining.b64" | sha256sum -c -
          base64 --decode /tmp/otopost-remaining.b64 | tar -xzf -
          rm -f .github/otopost-bundle.part-* .github/verified-bundle.part-* .github/workflows/apply-otopost-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): add admin carousel and MuseTalk workflows"
          git push origin HEAD:feat/admin-studio-carousel-musetalk
