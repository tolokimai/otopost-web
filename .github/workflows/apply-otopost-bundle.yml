name: Apply OtoPost source bundle

on:
  push:
    branches: [feat/admin-studio-carousel-musetalk]
    paths:
      - ".github/otopost-bundle.part-*"
      - ".github/workflows/apply-otopost-bundle.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-studio-carousel-musetalk
          fetch-depth: 0
      - name: Apply verified source bundle
        run: |
          cat .github/otopost-bundle.part-* | base64 --decode | tar -xzf -
          rm -f .github/otopost-bundle.part-* .github/workflows/apply-otopost-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): add admin carousel and MuseTalk workflows"
          git push origin HEAD:feat/admin-studio-carousel-musetalk
