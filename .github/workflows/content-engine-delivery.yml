name: Content Engine delivery

on:
  push:
    branches:
      - feat/content-engine-persona-planner-library
    paths:
      - .github/workflows/content-engine-delivery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-engine-persona-planner-library
          fetch-depth: 0
      - name: Apply and validate integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/content-engine-patch.py
          python3 -m compileall -q backend/app backend/tests .github/content-engine-patch.py
          rm .github/content-engine-patch.py
          rm .github/workflows/content-engine-delivery.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(content-engine): wire Persona Planner Library workflow"
          git push origin HEAD:feat/content-engine-persona-planner-library
